{% extends 'main.html' %}
{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">


{% block abc %}
<h2> news page </h2>
<center>
    {% for i in data %}
      <h2>{{i.title}}</h2>
      <h3>{{i.desc|truncatewords:5}}</h3>
         <a href="{% url 'newsread' i.id %}">Read more</a>
    {% endfor %}
</center>
{% endblock %}
